---
name: Setup mise
description: Install the repository-pinned mise bootstrap after checksum verification
outputs:
  executable:
    description: Absolute path to the verified mise executable
    value: ${{ steps.install.outputs.executable }}
runs:
  using: composite
  steps:
    - name: Install mise
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        MISE_VERSION: "2026.8.4"
        MISE_SHA256: "529dd94fa29c8e0ad5913c25301c22b6a5097b1daa4271ad76699f4830d35d52"
      run: '"$ACTION_PATH/setup.sh"'
