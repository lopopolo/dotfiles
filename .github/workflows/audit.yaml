---
name: Audit
"on":
  pull_request:
    branches:
      - trunk
  schedule:
    - cron: "0 0 * * TUE"
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      js: ${{ steps.changes.outputs.js }}
      workflows: ${{ steps.changes.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          js=false
          workflows=false

          while IFS= read -r file; do
            if [[ "$file" == "package.json" ||
                  "$file" == "pnpm-lock.yaml" ||
                  "$file" == "pnpm-workspace.yaml" ||
                  "$file" == "mise.lock" ||
                  "$file" == "mise.toml" ||
                  "$file" == ".github/workflows/audit.yaml" ]]; then
              js=true
            fi
            if [[ "$file" == .github/actions/* ||
                  "$file" == .github/workflows/* ||
                  "$file" == "mise.lock" ||
                  "$file" == "mise.toml" ]]; then
              workflows=true
            fi
          done <<< "$changed_files"

          printf 'js=%s\n' "$js" >> "$GITHUB_OUTPUT"
          printf 'workflows=%s\n' "$workflows" >> "$GITHUB_OUTPUT"

  js:
    name: Audit JS Dependencies
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'schedule' || needs.changes.outputs.js == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup mise
        id: mise
        uses: ./.github/actions/setup-mise

      - name: Resolve toolchain versions
        id: toolchains
        uses: ./.github/actions/mise-tool-versions
        with:
          executable: ${{ steps.mise.outputs.executable }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ steps.toolchains.outputs.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit

  zizmor:
    name: Run zizmor 🌈
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
      needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-24.04
    permissions:
      actions: read # required to inspect workflow metadata
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          advanced-security: false
          persona: "pedantic"
          version: "1.26.1"
