---
name: Audit
"on":
  pull_request:
    branches:
      - trunk
  schedule:
    - cron: "0 0 * * TUE"
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      js: ${{ steps.changes.outputs.js }}
      workflows: ${{ steps.changes.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          js=false
          workflows=false

          while IFS= read -r file; do
            if [[ "$file" == "package.json" ||
                  "$file" == "pnpm-lock.yaml" ||
                  "$file" == "pnpm-workspace.yaml" ||
                  "$file" == "mise.lock" ||
                  "$file" == "mise.toml" ||
                  "$file" == ".github/workflows/audit.yaml" ]]; then
              js=true
            fi
            if [[ "$file" == .github/actions/* ||
                  "$file" == .github/workflows/* ||
                  "$file" == "mise.lock" ||
                  "$file" == "mise.toml" ]]; then
              workflows=true
            fi
          done <<< "$changed_files"

          printf 'js=%s\n' "$js" >> "$GITHUB_OUTPUT"
          printf 'workflows=%s\n' "$workflows" >> "$GITHUB_OUTPUT"

  js:
    name: Audit JS Dependencies
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'schedule' || needs.changes.outputs.js == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        id: mise
        uses: ./.github/actions/setup-mise

      - name: Resolve toolchain versions
        id: toolchains
        uses: ./.github/actions/mise-tool-versions
        with:
          executable: ${{ steps.mise.outputs.executable }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.toolchains.outputs.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit

  zizmor:
    name: Run zizmor 🌈
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
      needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-24.04
    permissions:
      actions: read # required to inspect workflow metadata
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        id: mise
        uses: ./.github/actions/setup-mise

      - name: Install zizmor
        uses: ./.github/actions/mise-install
        with:
          executable: ${{ steps.mise.outputs.executable }}
          tools: aqua:zizmorcore/zizmor

      - name: Run zizmor 🌈
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
        run: zizmor --persona=pedantic --format=github .
