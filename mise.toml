[tools]
node = "24.19.0"

"aqua:astral-sh/uv" = "0.12.5"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.13.1"
"aqua:zizmorcore/zizmor" = "1.29.0"

[hooks]
postinstall = "corepack enable"

[settings]
experimental = true
use_versions_host_track = false

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.pnpm-install]
description = "Install dependencies with pnpm when lockfile changes"
run = "pnpm install"
sources = ["package.json", "pnpm-lock.yaml", "mise.toml"]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks.bootstrap]
description = "Install dotfiles and create development directories"
run = "./scripts/bootstrap.sh"

[tasks.completions]
description = "Generate shell completions"
run = "./scripts/generate_completions.sh"

[tasks.fmt]
description = "Format repository files"
run = "./scripts/format.sh"

[tasks.fmt-check]
description = "Check repository formatting"
run = "./scripts/format.sh --check"

[tasks.lint]
description = "Lint repository shell"
run = "./scripts/lint_shell.sh"

[tasks.check]
description = "Run all repository checks"
depends = ["fmt-check", "lint"]

[tasks.brewfile]
description = "Snapshot Homebrew packages for the current machine"
run = "./scripts/snapshot_homebrew_packages.sh"

[tasks.brew-bundle-install]
description = "Install Homebrew packages and refresh mise"
run = "./scripts/install_homebrew_packages.sh"

[tasks.mise-install]
description = "Install or refresh mise from its signed installer"
run = "./scripts/refresh_mise.sh"

[tasks.signing-keys]
description = "Import and locally certify upstream signing keys"
run = "./scripts/import_signing_keys.sh"

[tasks.signing-key-mise]
description = "Import and locally certify the mise release key"
run = "./scripts/import_signing_keys.sh mise"
